name: Docker image

# Builds the serving image and queries it. It only runs when something the image
# depends on changes (and weekly, to catch breakage in upstream packages), so
# ordinary PRs do not pay for it.
on:
  pull_request:
    paths:
      - 'docker/**'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'src/adaptive_classifier/serving.py'
      - 'scripts/docker_smoke.py'
      - '.github/workflows/docker.yml'
  push:
    branches: [ main ]
    paths:
      - 'docker/**'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'src/adaptive_classifier/serving.py'
      - 'scripts/docker_smoke.py'
      - '.github/workflows/docker.yml'
  workflow_dispatch:
  schedule:
    - cron: '43 5 * * 1'

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip

    - name: Build image
      run: docker build -f docker/Dockerfile -t adaptive-classifier .

    # A tiny local encoder, so no Hugging Face access is needed.
    - name: Install library (to create a model to serve)
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Serve and query
      run: python scripts/docker_smoke.py adaptive-classifier
